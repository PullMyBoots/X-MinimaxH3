[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "x-minimaxh3"
version = "1.1.0"
description = "Resource-tiered MiniMax H3 video generation service for NVIDIA SM89"
requires-python = "==3.10.*"
dependencies = [
  "aiohttp>=3.13,<4",
  "Pillow>=11,<13",
  "huggingface-hub>=0.34,<2",
  "safetensors>=0.7,<1",
  "numpy>=2.2,<3",
  "opencv-python-headless>=4.10,<5",
  "scipy>=1.15,<1.16",
  "webrtcvad-wheels==2.0.14",
  "av>=17,<18",
  "diffusers==0.35.2",
  "einops>=0.8,<1",
  "transformers==5.6.2",
  "loguru>=0.7,<0.8",
  "tqdm>=4.67,<5",
  "imageio==2.37.0",
  "imageio-ffmpeg==0.6.0",
]

[tool.setuptools.packages.find]
include = ["h3serve*"]

[tool.setuptools.package-data]
"h3serve" = ["assets/*.onnx", "assets/*.md"]
"h3serve.native_engine.planner" = ["evidence/*.json"]
